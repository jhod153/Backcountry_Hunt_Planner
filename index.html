<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#435744">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Backcountry Hunt Planner</title>
</head>
<body data-theme="light">
  <main class="app">
    <section class="hero" aria-label="Backcountry Hunt Planner">
      <div class="hero-brand-row">
        <div class="brand-lockup">
          <svg class="brand-mark" viewBox="0 0 76 58" role="img" aria-label="Mountain mark">
            <path d="M4 50 24 17l11 17L48 7l24 43H4Z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
            <path d="m18 50 16-19 8 10 9-12 14 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 21 24 30l7-2m21-16-5 13 9-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="brand-text"><strong>BACKCOUNTRY</strong><span>HUNT PLANNER</span></div>
        </div>
        <div class="theme-toggle" id="themeToggle" aria-label="Theme toggle">
          <button class="theme-btn" data-theme-choice="light" type="button" aria-label="Light mode">☀</button>
          <button class="theme-btn" data-theme-choice="dark" type="button" aria-label="Dark mode">☾</button>
        </div>
      </div>


      <div class="hero-copy">
        <div class="eyebrow">Field planning · British Columbia</div>
        <h1>Plan smart.<br>Hunt far.</h1>
        <p class="hero-subtitle">Optimize your pack, dial in nutrition, and focus on what matters.</p>
      </div>

      <div class="hero-landscape-photo" aria-hidden="true"></div>
    </section>

    <section class="card account-card" aria-label="Account and saved hunts">
      <div class="actions"><button id="accountToggle" class="secondary" type="button">Log in / Sign up</button><span id="accountStatus">Log in to save hunts across devices.</span></div>
      <form id="accountForm" class="hidden account-fields">
        <label>Email<input id="accountEmail" type="email" class="field" autocomplete="email" required></label>
        <label>Password<input id="accountPassword" type="password" class="field" autocomplete="current-password" required minlength="8"></label>
        <div class="actions"><button class="primary" type="submit">Log in</button><button id="signup" class="secondary" type="button">Create account</button><button id="forgotPassword" class="text-btn" type="button">Forgot password</button></div>
      </form>
      <form id="resetForm" class="hidden account-fields"><label>New password<input id="newPassword" class="field" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">Set password</button></form>
      <div id="huntControls" class="hidden account-fields"><label>Saved hunts<select id="savedHunts" class="field"><option value="">Choose a hunt</option></select></label><div class="actions"><button id="loadHunt" class="secondary" type="button">Load hunt</button><button id="saveHunt" class="primary" type="button">Save hunt</button><button id="saveNewHunt" class="secondary" type="button">Save as new hunt</button><button id="logout" class="text-btn" type="button">Log out</button></div><small>Save after making changes. “Save as new hunt” keeps the previous hunt.</small></div>
      <p id="accountMessage" role="status" aria-live="polite"></p>
    </section>
    <nav id="tabs" class="tabs"></nav>
    <div id="topMetrics" class="metrics"></div>
    <section id="setup" class="panel active"></section>
    <section id="pack" class="panel"></section>
    <section id="food" class="panel"></section>
    <section id="shopping" class="panel"></section>
    <section id="check" class="panel"></section>
    <section id="truck" class="panel"></section>
  </main>

  <div id="gearManager" class="gear-manager hidden" aria-hidden="true">
    <div class="gear-manager-backdrop" data-close-gear="1"></div>
    <section class="gear-manager-sheet" role="dialog" aria-modal="true" aria-label="Gear library">
      <div class="gear-manager-head">
        <div><div class="section-kicker">Equipment</div><h2 id="gearManagerTitle">My Gear</h2></div>
        <button class="icon-btn" id="closeGearManager" type="button" aria-label="Close gear library">×</button>
      </div>
      <div id="gearManagerBody"></div>
    </section>
  </div>
  <script src="data.js"></script>
  <dialog id="productLookup" class="lookup-dialog"><div class="actions"><h2 id="lookupTitle">Find product</h2><button id="closeLookup" class="secondary" type="button">Close</button></div><form id="lookupForm" class="account-fields"><label>Product name<input id="lookupQuery" class="field" required minlength="3" maxlength="120"></label><button class="primary">Search</button></form><p id="lookupMessage" role="status" aria-live="polite"></p><div id="lookupResults"></div></dialog>
  <script src="app.js"></script>
  <script type="module" src="account.js"></script>
  <script src="product-lookup.js"></script>
</body>
</html>
