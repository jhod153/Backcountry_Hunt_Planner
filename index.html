<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a5c46">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Backcountry Hunt Planner</title>
</head>
<body data-theme="light">
  <main class="app">
    <section class="hero">
      <div class="hero-top">
        <div class="chips">
          <span class="chip">BC Alpine</span>
          <span class="chip">Backcountry</span>
          <span class="chip">Fireweed</span>
        </div>
        <div class="theme-toggle" id="themeToggle" aria-label="Theme toggle">
          <button class="theme-btn" data-theme-choice="light" type="button">Light</button>
          <button class="theme-btn" data-theme-choice="dark" type="button">Dark</button>
        </div>
      </div>
      <div class="eyebrow">Field planning · mobile-first</div>
      <h1>Backcountry Hunt Planner</h1>
      <div class="hero-subtitle">Full prototype · refined BC alpine styling · searchable food library</div>
    </section>
    <nav id="tabs" class="tabs"></nav>
    <div id="topMetrics" class="metrics"></div>
    <section id="setup" class="panel active"></section>
    <section id="pack" class="panel"></section>
    <section id="food" class="panel"></section>
    <section id="shopping" class="panel"></section>
    <section id="check" class="panel"></section>
    <section id="truck" class="panel"></section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
